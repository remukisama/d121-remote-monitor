<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>D121 演示提词器</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf4fa;font-family:"Microsoft YaHei",sans-serif}header{padding:20px 5vw 14px;border-bottom:1px solid #334455}h1{font-size:22px;margin:0 0 14px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{padding:10px 14px;background:#213448;color:#fff;border:1px solid #607588;border-radius:7px;font-size:15px}button{cursor:pointer}button.primary{background:#007c74;border-color:#50dfc5}label{font-size:14px}input{vertical-align:middle;width:90px}#hint{padding:14px 5vw;background:#1b2c3b;font-size:15px;line-height:1.7;color:#c7dae9}#reader{height:calc(100vh - 245px);min-height:250px;overflow-y:auto;padding:30px max(5vw,calc((100vw - 980px)/2)) 45vh;scrollbar-width:thin;font-size:40px;line-height:1.85}#reader p{margin:0 0 1em}footer{padding:10px 5vw;font-size:13px;color:#a8bdcd}#status{color:#50dfc5;font-weight:bold}button:focus-visible,select:focus-visible{outline:3px solid #50dfc5;outline-offset:3px}@media(max-width:700px){#reader{height:60vh;font-size:30px}header{padding:15px}#hint{padding:12px 15px}input{width:65px}}</style>
<header><h1>D121 演示提词器</h1><nav><select id="scene" aria-label="口播段落"></select><button id="play" class="primary">开始滚动</button><button id="reset">回到开头</button><label>字号 <input id="font" type="range" min="26" max="64" value="40"></label><label>速度 <input id="speed" type="range" min="5" max="65" value="18"></label><span id="status">已暂停</span></nav></header>
<div id="hint"></div><main id="reader" tabindex="0" aria-label="提词正文"></main><footer>空格 播放或暂停 · 左右方向键 切换段落 · 操作提示不用读出 · 完全离线 无账号或网络请求</footer>
<script>const DATA={"scenes": [{"time": "00:00–00:30", "title": "项目与实物", "camera": "全景拍到三块主从板、NodeMCU 和 D121 屏幕；用指示笔按主站、星火、龙芯、网络模块顺序指认。", "action": "保持热点、供电和原有接线；用正常在线画面开场。", "speech": "大家好，下面演示这套基于 D121 的双节点设备监控终端。它把两台从站的数据汇总到本地屏幕，同时记录历史并上传云端。我会先展示正常采集，再演示单站异常和上传恢复后的事件补传。", "proof": "实物与系统组成一一对应；无需展示密码、云控制台或烧录过程。"}, {"time": "00:30–01:15", "title": "正常采集与数据", "camera": "近景拍 D121 总览，切换星火和龙芯，再录手机总览和趋势。", "action": "展示温湿度、振动峰值、CPU、内存和运行时间。可轻轻晃动传感板观察振动变化，停下后看恢复。", "speech": "星火从站提供温湿度和六轴数据，龙芯从站提供 CPU、内存和运行时间。主站通过同一条 RS485 总线轮询，协议是 Modbus RTU。这里可以切换两台从站；数据是否在线、是否新鲜、传感器是否有效分别判断。手机上的振动值是一秒内采样点的峰值指标。", "proof": "两站在线，更新时间推进；晃动对应振动数值变化，不将其称为动作识别。"}, {"time": "01:15–02:00", "title": "历史与本地回放", "camera": "拍 D121 黑匣子事件列表和一条可用回放，再拍手机历史事件及详情。", "action": "选择已有事件并等待读取完成，再切换节点或退出；有缺失窗口时如实展示。", "speech": "除了当前读数，主站会把数据和事件记录到 TF 卡。这里可以回看事件附近的历史，手机端也能查看云端保存的事件和事前读数。本地原始记录与云端每秒摘要的采样密度不同，缺失的数据会保留为空，不会补画成实际测量。", "proof": "事件、时间来源、曲线与节点对应；不把旧读数说成当前状态。"}, {"time": "02:00–02:45", "title": "单站异常隔离", "camera": "主画面拍 D121 两站状态，画中画保留电脑执行命令与时间。", "action": "运行 StarFault，软件停止星火应答 3 秒后自动恢复；观察星火离线/恢复、龙芯继续更新。", "speech": "现在用软件停止星火的应答，模拟单台从站通信中断。星火出现离线事件时，龙芯仍继续采集，本地记录任务也保持运行。恢复星火应答后，数据重新有效，系统保留中断和恢复事件，便于后续回看。", "proof": "星火离线与恢复均可见，龙芯更新继续；不要剪去故障与恢复之间的关键画面。"}, {"time": "02:45–04:15", "title": "暂停上传与可靠补传", "camera": "电脑 cloud stat、D121 采集画面、手机总览/事件列表连续录制；可后期拼接成同一时间线。", "action": "运行 NetworkFault：上传暂停 30 秒，期间停止并恢复星火应答，显示排队事件；随后自动重连并等待队列清空。", "speech": "接下来采用软件暂停上传，做一次受控断网模拟。本地采集继续运行；暂停期间，再产生一组星火通信中断和恢复事件，可以看到关键事件进入队列。上传恢复后，设备把事件及事前摘要送到后台，后台写入数据库并返回应用确认，设备才移出这些记录。这里关注队列从有到零，以及云端能否读到对应事件。MQTT 本身仍使用 QoS0，可靠补传由应用层队列、确认和数据库去重共同完成。", "proof": "offline 时 queued 增加，恢复后 online=1、tls=1、auth_verified=1、queued=0；手机能打开本轮事件。"}, {"time": "04:15–05:00", "title": "结果与边界", "camera": "拍手机本轮事件详情，再回到完整硬件与正常在线画面。", "action": "运行 Check，确认双站、TF 和网络均恢复；结尾展示正常状态。时间不足时保留这一步。", "speech": "最后，两台从站已经恢复在线，本地记录继续，上传队列也已清空。设备端 TLS 已检查 CA、服务器域名和证书有效期，手机移动网络下的登录、实时数据、历史和详情也已验证。当前版本完成了从采集、记录到异常补传的链路。长期观测仍待后续进行，精细动作分类和完整离线波形上云还没有实现。以上就是本次演示。", "proof": "最终状态与发言一致；恢复失败时停止录制并保留日志，不宣称通过。"}], "short": "大家好，下面介绍这套基于 D121 的双节点设备监控终端。它通过 Modbus RTU 连接两台从站：星火板采集温湿度和六轴数据，龙芯板提供 CPU、内存和运行时间等系统指标。\n主站在触摸屏上显示数据，并把采集结果和事件记录到 TF 卡，支持历史回放。数据摘要与关键事件通过 ESP8266 加密上传，在微信小程序中可以查看实时状态、趋势和事件详情。\n这次演示重点是异常前后的记录：单台从站停止应答时，另一台仍继续采集；上传暂停期间，新产生的关键事件进入本地队列，网络恢复后补传，并在云端保存确认后移出队列。\n目前双站通信、本地回放、TLS、事件补传和手机移动网络访问已经完成验证。长期观测还没有做，完整离线波形上云和精细动作分类也不在当前版本范围。", "opening": "大家好，下面演示这套基于 D121 的双节点设备监控终端。它把两台从站的数据汇总到本地屏幕，同时记录历史并上传云端。我会先展示正常采集，再演示单站异常和上传恢复后的事件补传。"};const sel=document.querySelector('#scene'),reader=document.querySelector('#reader'),play=document.querySelector('#play'),hint=document.querySelector('#hint');let running=false,last=0,position=0;
const choices=[{title:'约 30 秒开场',speech:DATA.opening,action:'先拍完整实物和正常在线画面。'},{title:'约 90 秒项目介绍',speech:DATA.short,action:'用于短版视频；按自己的语速彩排。'},...DATA.scenes.map(s=>({title:s.time+' '+s.title,speech:s.speech,action:s.action}))];
choices.push({title:'完整主视频口播',speech:DATA.scenes.map(s=>s.speech).join('\n\n'),action:'操作请对照拍摄指南与分镜，不必一次连续读完。'});
choices.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title;sel.append(o)});
function state(){play.textContent=running?'暂停滚动':'开始滚动';document.querySelector('#status').textContent=running?'滚动中':'已暂停'}
function load(){running=false;last=0;position=0;reader.replaceChildren();for(const text of choices[+sel.value].speech.split('\n').filter(Boolean)){let p=document.createElement('p');p.textContent=text;reader.append(p)}reader.scrollTop=0;hint.textContent='操作提示：'+choices[+sel.value].action;state()}
sel.addEventListener('change',load);play.onclick=()=>{running=!running;last=0;position=reader.scrollTop;state()};document.querySelector('#reset').onclick=()=>{position=0;reader.scrollTop=0};document.querySelector('#font').oninput=e=>reader.style.fontSize=e.target.value+'px';reader.addEventListener('wheel',()=>{running=false;state()},{passive:true});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();play.click()}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();sel.selectedIndex=Math.max(0,Math.min(sel.options.length-1,sel.selectedIndex+(e.key==='ArrowRight'?1:-1)));load()}});
function frame(t){if(running){if(last)position+=(t-last)/1000*(+document.querySelector('#speed').value);last=t;reader.scrollTop=position;if(reader.scrollTop>=reader.scrollHeight-reader.clientHeight-2){running=false;state()}}requestAnimationFrame(frame)}load();requestAnimationFrame(frame);</script></html>
